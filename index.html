<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Guru Charan Mavuduru — AI Security, SOC Engineering and Applied AI portfolio." />
    <meta name="theme-color" content="#05070b" />
    <link rel="icon" href="/Gurucharan/favicon.svg" />
    <link rel="manifest" href="/Gurucharan/site.webmanifest" />
    <title>Guru Charan — Security Intelligence Universe</title>
    <style>
      html,body{min-height:100%;margin:0;background:#05070b;color:#f4f1e8}
      #boot-fallback{min-height:100vh;display:grid;place-items:center;padding:32px;box-sizing:border-box;font-family:system-ui,sans-serif;background:radial-gradient(circle at 72% 20%,rgba(85,230,255,.08),transparent 32%),#05070b}
      .boot-card{width:min(900px,100%);border:1px solid rgba(173,218,255,.16);padding:40px;background:rgba(9,13,20,.88)}
      .boot-kicker{font:700 10px/1.5 monospace;letter-spacing:.18em;color:#55e6ff}
      .boot-title{margin:18px 0 12px;font:600 clamp(42px,8vw,100px)/.9 system-ui,sans-serif;letter-spacing:-.06em}
      .boot-copy{color:#8f9baa;line-height:1.7;max-width:650px}
      .boot-status{margin-top:26px;color:#67f0b8;font:700 10px monospace;letter-spacing:.12em;text-transform:uppercase}
      #boot-error{display:none;margin-top:20px;padding:14px;border:1px solid rgba(247,185,85,.35);color:#f7b955;font:12px/1.6 monospace;white-space:pre-wrap;overflow-wrap:anywhere}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">
        <div class="boot-card">
          <div class="boot-kicker">GURUVERSE / SECURITY INTELLIGENCE UNIVERSE</div>
          <div class="boot-title">GURU<br>CHARAN</div>
          <div class="boot-copy">Initialising the portfolio interface. This static safety shell remains visible if the application bundle fails to start.</div>
          <div class="boot-status">SYSTEM BOOT / WAITING FOR APPLICATION</div>
          <div id="boot-error"></div>
        </div>
      </div>
    </div>
    <noscript><div id="boot-fallback"><div class="boot-card"><div class="boot-kicker">GURUVERSE / JAVASCRIPT REQUIRED</div><div class="boot-title">GURU<br>CHARAN</div><div class="boot-copy">JavaScript is required to load the interactive portfolio.</div></div></div></noscript>
    <script>
      (() => {
        const errorBox = document.getElementById('boot-error');
        const showError = (message) => {
          if (!errorBox) return;
          errorBox.style.display = 'block';
          errorBox.textContent = message;
        };
        window.addEventListener('error', (event) => {
          const target = event.target;
          if (target && target.tagName === 'SCRIPT') {
            showError('APPLICATION BUNDLE FAILED TO LOAD\\n' + (target.src || 'Unknown script'));
          } else if (event.error) {
            showError('APPLICATION RUNTIME ERROR\\n' + (event.error.message || event.message || 'Unknown error'));
          }
        }, true);
        window.addEventListener('unhandledrejection', (event) => {
          showError('APPLICATION PROMISE ERROR\\n' + String(event.reason?.message || event.reason || 'Unknown rejection'));
        });
      })();
    </script>
    <script type="module" src="/Gurucharan/assets/index-__VITE_BUNDLE__.js"></script>
  </body>
</html>
