name: Deploy cinematic portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        env:
          VITE_PORTFOLIO_API_URL: https://script.google.com/macros/s/AKfycbz0jrdX1n-_SS8E1yRLdGUXjHcphb0p1urYyFbi5gGar0q3Xt8iAPagjY3NFZmRSq67/exec
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Fresh deployment trigger after switching Pages source to GitHub Actions.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
